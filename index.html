```html
<!DOCTYPE html>
<html>
<head>
    <title>My Registration Form</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 650px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            text-align: center;
            color: darkblue;
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .form-row label {
            width: 180px;
            font-weight: bold;
        }

        .form-row input[type="text"],
        .form-row input[type="email"],
        .form-row input[type="password"],
        .form-row input[type="tel"],
        .form-row input[type="date"],
        .form-row select,
        .form-row textarea {
            width: 300px;
            padding: 9px;
            border: 1px solid gray;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .gender,
        .hobbies {
            width: 300px;
        }

        /* Name + Photo */
        .photo-row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .photo-row > label {
            width: 180px;
            font-weight: bold;
        }

        .photo-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .photo-content input[type="text"] {
            width: 200px;
            padding: 9px;
            border: 1px solid gray;
            border-radius: 6px;
        }

        .photo-upload {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .photo-box {
            width: 100px;
            height: 100px;
            border: 2px dashed gray;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-text {
            color: gray;
            font-size: 12px;
            text-align: center;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        .buttons input {
            padding: 10px 30px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .submit {
            background-color: green;
            color: white;
        }

        .reset {
            background-color: red;
            color: white;
        }

        .submit:hover {
            background-color: darkgreen;
        }

        .reset:hover {
            background-color: darkred;
        }
        input[type=submit]{
            border-radius:100px;
        }
          input[type=reset]{
            border-radius:100px;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>My Registration Form</h1>

        <form>

            <!-- Full Name + Photo -->
            <div class="photo-row">

                <label>My Full Name 👤</label>

                <div class="photo-content">

                    <input type="text"
                           placeholder="Enter Your Name">

                    <div class="photo-upload">

                        <input type="file"
                               id="photo"
                               accept="image/*"
                               onchange="showImage(event)">

                        <div class="photo-box">

                            <span class="photo-text" id="photoText">
                                Photo Preview
                            </span>

                            <img id="preview" alt="Selected Photo">

                        </div>

                    </div>

                </div>

            </div>


            <!-- Father's Name -->
            <div class="form-row">

                <label>Father's Name 👑</label>

                <input type="text"
                       placeholder="Enter Father's Name">

            </div>


            <!-- Email -->
            <div class="form-row">

                <label>Email 📧</label>

                <input type="email"
                       placeholder="Enter Email">

            </div>


            <!-- Password -->
            <div class="form-row">

                <label>Password 🔐</label>

                <input type="password"
                       placeholder="Enter Password">

            </div>


            <!-- Mobile Number -->
            <div class="form-row">

                <label>Mobile Number 📱</label>

                <input type="tel"
                       placeholder="Enter Mobile Number">

            </div>


            <!-- Gender -->
            <div class="form-row">

                <label>Gender ⚧</label>

                <div class="gender">

                    <input type="radio"
                           name="gender">
                    Male

                    <input type="radio"
                           name="gender">
                    Female

                </div>

            </div>


            <!-- Date of Birth -->
            <div class="form-row">

                <label>Date of Birth 📅</label>

                <input type="date">

            </div>


            <!-- Course -->
            <div class="form-row">

                <label>Course 📖</label>

                <select>

                    <option>-- Select Course --</option>
                    <option>BCA</option>
                    <option>B.Tech</option>
                    <option>B.Sc</option>
                    <option>B.Com</option>
                    <option>MCA</option>

                </select>

            </div>


            <!-- Hobbies -->
            <div class="form-row">

                <label>My Hobbies 🎯</label>

                <div class="hobbies">

                    <input type="checkbox">
                    Reading 📖

                    <br><br>

                    <input type="checkbox">
                    Music 🎶

                    <br><br>

                    <input type="checkbox">
                    Sports 🏏

                    <br><br>

                    <input type="checkbox">
                    Listening Songs 🎵

                </div>

            </div>


            <!-- Address -->
            <div class="form-row">

                <label>Address 🏠</label>

                <textarea rows="4"
                          placeholder="Enter Address"></textarea>

            </div>


            <!-- Submit & Reset -->
            <div class="buttons">

                <input type="submit"
                       value="Submit"
                       class="submit">

                <input type="reset"
                       value="Reset"
                       class="reset">

            </div>

        </form>

    </div>


    <!-- Image Preview JavaScript -->
    <script>

        function showImage(event) {

            const file = event.target.files[0];

            const preview = document.getElementById("preview");

            const photoText = document.getElementById("photoText");

            if (file) {

                preview.src = URL.createObjectURL(file);

                preview.style.display = "block";

                photoText.style.display = "none";

            }

        }

    </script>

</body>
</html>
