<!DOCTYPE html>
<html>
<head>
    <title>My Registration Form</title>
</head>
<body bgcolor="lightblue">

        <label>Password....</label>

        <label> My Hobbies....🎯</label>

         <input type="checkbox"> listening song....🎶🎵
        <br><br>

        <label>Address.....🏠</label><br>

        " cols="30" placeholder="Enter Address"></textarea>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
